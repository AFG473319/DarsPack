name: darspack
description: "درس‌پک — کتابخانه‌ی درسی آفلاین، فارسی‌اول"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Data layer (see DESIGN.md)
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^10.0.0
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  archive: ^4.0.7
  shamsi_date: ^1.0.2
  open_filex: ^4.5.0

  # LAN client + server (see DESIGN.md)
  http: ^1.4.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  network_info_plus: ^6.0.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/web/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

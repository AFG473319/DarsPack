# TEMPORARY repro job for the ImportWorker crash on Windows + Python 3.14.
# First experiment (isolated test_worker_errors.py 50x per cell) gave 0/200
# failures, so the crash needs the full-suite context. This version runs the
# FULL suite 10 times on Python 3.14 + PySide6 6.12.0 and counts crashes.
# Delete this file (and the ci/worker-crash-repro branch) once the crash is
# understood. Triggered on push to this branch.
name: Worker crash repro (temporary)

on:
  push:
    branches: [ci/worker-crash-repro]

permissions:
  contents: read

jobs:
  repro:
    name: repro full suite (Python 3.14, PySide6 6.12.0)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run full suite 10 times
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $failures = 0
          for ($i = 1; $i -le 10; $i++) {
            python -m pytest -q --cov=darspack --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml
            if ($LASTEXITCODE -ne 0) { $failures++; Write-Output "run $i FAILED (exit $LASTEXITCODE)" }
          }
          Write-Output "RESULT failures: $failures / 10"
          if ($failures -gt 0) { exit 1 }

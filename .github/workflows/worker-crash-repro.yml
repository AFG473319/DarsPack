# TEMPORARY repro job for the ImportWorker crash on Windows + Python 3.14.
# Runs only tests/test_worker_errors.py 50 times per matrix cell and counts
# failures. Delete this file (and the ci/worker-crash-repro branch) once the
# crash is understood. Triggered manually only: Actions -> Run workflow.
name: Worker crash repro (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: repro (Python ${{ matrix.python-version }}, PySide6 ${{ matrix.pyside }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        pyside: ["6.12.0", "6.11.3"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install "PySide6-Essentials==${{ matrix.pyside }}"

      - name: Run worker tests 50 times
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $failures = 0
          for ($i = 1; $i -le 50; $i++) {
            python -m pytest tests/test_worker_errors.py -q -p no:cacheprovider
            if ($LASTEXITCODE -ne 0) { $failures++; Write-Output "run $i FAILED (exit $LASTEXITCODE)" }
          }
          Write-Output "RESULT failures: $failures / 50"
          if ($failures -gt 0) { exit 1 }

# DarsPack Android CI — analyze, test and build the release APK.
#
# Runs when files under android/ change (or this workflow changes).
# The APK is signed with the debug key (the scaffold default): fine for
# sideload testing on a personal device; proper release signing is a
# separate step before any public release.
name: Android (Flutter)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: darspack-apk
          path: android/build/app/outputs/flutter-apk/app-release.apk

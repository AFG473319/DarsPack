# DarsPack releases — tag-driven, with two channels like any GitHub project:
#
#   stable:  tag vX.Y.Z         (e.g. v0.2.2)          → release "DarsPack X.Y.Z",
#               GitHub marks it **Latest** automatically.
#   beta:    tag vX.Y.Z-beta.N  (e.g. v0.2.2-beta.1)   → release "DarsPack X.Y.Z-beta.1",
#               published as a **Pre-release** (never Latest).
#               (-alpha.N and -rc.N behave the same way.)
#
# Pipeline: full test suite → version consistency gate (scripts/
# check_release_tag.py: tag ↔ __version__ ↔ installer AppVersion must all
# agree) → PyInstaller + Inno Setup build → SHA-256 checksums → GitHub
# Release with all assets attached.
#
# Rehearsal without publishing: run this workflow manually with the
# dry_run input enabled (default) — it tests and builds but releases nothing.
#
# Tag pushes are the only automatic trigger; tags are never moved or
# re-pointed (a published release tag is immutable history).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only — do not create a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write   # create GitHub Releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # a release must never be interrupted halfway

jobs:
  release:
    name: build & publish
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
      # Windows runners default to cp1252 consoles; UTF-8 mode keeps
      # non-ASCII output (↔, —, Persian) safe in Python steps.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Create the .venv the build scripts expect and install everything
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r requirements-dev.txt

      - name: Run the test suite (release gate, Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/Scripts/python -m pytest -q

      - name: Verify tag ↔ app version ↔ installer version agree
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        run: .venv/Scripts/python scripts/check_release_tag.py "$env:TAG"

      - name: Build the portable app folder (PyInstaller onedir)
        shell: cmd
        run: installer\build.bat

      - name: Build the installer (Inno Setup, preinstalled on the runner)
        shell: cmd
        run: installer\build-installer.bat

      - name: Zip the portable folder
        shell: pwsh
        run: Compress-Archive -Path dist/DarsPack -DestinationPath dist/DarsPack-windows.zip

      - name: Write SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum DarsPack-Setup.exe DarsPack-windows.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the GitHub Release
        # Tag push (publish) unless a manual dry run asked to skip it.
        if: ${{ github.ref_type == 'tag' && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ARGS=(--title "DarsPack ${TAG#v}" --generate-notes)
          if [[ "$TAG" =~ -(alpha|beta|rc)\.[0-9]+$ ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" \
            dist/DarsPack-Setup.exe \
            dist/DarsPack-windows.zip \
            dist/SHA256SUMS.txt \
            "${ARGS[@]}"

      - name: Upload build artifacts (always, including dry runs)
        uses: actions/upload-artifact@v4
        with:
          name: DarsPack-${{ github.ref_name }}
          path: |
            dist/DarsPack-Setup.exe
            dist/DarsPack-windows.zip
            dist/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

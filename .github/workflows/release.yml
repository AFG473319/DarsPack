# DarsPack releases — tag-driven, with two channels like any GitHub project:
#
#   stable:  tag vX.Y.Z         (e.g. v0.2.2)          → release "DarsPack X.Y.Z",
#               GitHub marks it **Latest** automatically.
#   beta:    tag vX.Y.Z-beta.N  (e.g. v0.2.2-beta.1)   → release "DarsPack X.Y.Z-beta.1",
#               published as a **Pre-release** (never Latest).
#               (-alpha.N and -rc.N behave the same way.)
#
# Pipeline: full test suite → version consistency gate (scripts/
# check_release_tag.py: tag ↔ __version__ ↔ installer AppVersion must all
# agree) → Windows build (PyInstaller + Inno Setup) and Linux build
# (PyInstaller onedir, packed as DarsPack-linux.tar.gz) → SHA-256
# checksums covering every asset → GitHub Release with all assets attached.
# The Windows job creates the release; the Linux job adds its tarball to
# the same release and extends the checksums file to cover it.
#
# Release notes: a curated changelog committed as docs/releases/<tag>.md
# is used as the release body when present (it ships with the version
# bump, so the notes match the tagged code); otherwise the workflow falls
# back to GitHub's generated notes.
#
# Rehearsal without publishing: run this workflow manually with the
# dry_run input enabled (default) — it tests and builds but releases nothing.
#
# Tag pushes are the only automatic trigger; tags are never moved or
# re-pointed (a published release tag is immutable history).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only — do not create a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write   # create GitHub Releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # a release must never be interrupted halfway

jobs:
  release:
    name: build & publish
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
      # Windows runners default to cp1252 consoles; UTF-8 mode keeps
      # non-ASCII output (↔, —, Persian) safe in Python steps.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Create the .venv the build scripts expect and install everything
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r requirements-dev.txt

      - name: Run the test suite (release gate, Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/Scripts/python -m pytest -q

      - name: Verify tag ↔ app version ↔ installer version agree
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        run: .venv/Scripts/python scripts/check_release_tag.py "$env:TAG"

      - name: Build the portable app folder (PyInstaller onedir)
        shell: cmd
        run: installer\build.bat

      - name: Build the installer (Inno Setup, preinstalled on the runner)
        shell: cmd
        run: installer\build-installer.bat

      - name: Zip the portable folder
        shell: pwsh
        run: Compress-Archive -Path dist/DarsPack -DestinationPath dist/DarsPack-windows.zip

      - name: Write SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum DarsPack-Setup.exe DarsPack-windows.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the GitHub Release
        # Tag push (publish) unless a manual dry run asked to skip it.
        if: ${{ github.ref_type == 'tag' && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: docs/releases/${{ github.ref_name }}.md
        shell: bash
        run: |
          # Release notes: a curated changelog committed as
          # docs/releases/<tag>.md (it ships in the same commit as the
          # version bump, so the notes always match the tagged code),
          # otherwise GitHub's generated notes as a fallback.
          if [ -f "$NOTES_FILE" ]; then
            echo "Using curated release notes: $NOTES_FILE"
            NOTES=(--notes-file "$NOTES_FILE")
          else
            echo "No $NOTES_FILE — using GitHub's generated notes"
            NOTES=(--generate-notes)
          fi
          ARGS=(--title "DarsPack ${TAG#v}")
          if [[ "$TAG" =~ -(alpha|beta|rc)\.[0-9]+$ ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" \
            dist/DarsPack-Setup.exe \
            dist/DarsPack-windows.zip \
            dist/SHA256SUMS.txt \
            "${ARGS[@]}" "${NOTES[@]}"

      - name: Upload build artifacts (always, including dry runs)
        uses: actions/upload-artifact@v4
        with:
          name: DarsPack-${{ github.ref_name }}
          path: |
            dist/DarsPack-Setup.exe
            dist/DarsPack-windows.zip
            dist/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

  release-linux:
    name: build & publish (Linux)
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      # The PySide6 wheel does not bundle Qt's system libraries; without
      # these, importing QtGui fails with `libEGL.so.1: cannot open shared
      # object file`. Same list as ci.yml / docs/dependencies.md.
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # installer/build-linux.sh runs .venv-linux/bin/pyinstaller, so this
      # creates the same layout a developer has after
      # `python3 -m venv .venv-linux`.
      - name: Create the .venv-linux the build script expects
        run: python -m venv .venv-linux

      - name: Install dependencies into the venv
        run: .venv-linux/bin/python -m pip install -r requirements-dev.txt

      - name: Build the portable app folder (PyInstaller onedir)
        run: bash installer/build-linux.sh

      # A GUI app does not exit on its own: timeout kills it after 20s
      # (exit 124 = still running, i.e. it started fine). Any other exit
      # code means it crashed during startup.
      - name: Smoke-test the built binary (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          test -x dist/DarsPack/DarsPack
          timeout 20 dist/DarsPack/DarsPack || test $? -eq 124

      - name: Pack the portable folder as a tarball
        run: tar -czf dist/DarsPack-linux.tar.gz -C dist DarsPack

      - name: Publish the Linux asset to the GitHub Release
        # The Windows job already created the release; this only adds the
        # Linux tarball to it (and extends the checksums file to cover it).
        # Tag push (publish) unless a manual dry run asked to skip it.
        if: ${{ github.ref_type == 'tag' && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$TAG" dist/DarsPack-linux.tar.gz --clobber
          mkdir -p /tmp/checksums
          gh release download "$TAG" --pattern "SHA256SUMS.txt" --dir /tmp/checksums
          cd dist
          sha256sum DarsPack-linux.tar.gz >> /tmp/checksums/SHA256SUMS.txt
          cat /tmp/checksums/SHA256SUMS.txt
          gh release upload "$TAG" /tmp/checksums/SHA256SUMS.txt --clobber

      - name: Upload build artifacts (always, including dry runs)
        uses: actions/upload-artifact@v4
        with:
          name: DarsPack-linux-${{ github.ref_name }}
          path: dist/DarsPack-linux.tar.gz
          retention-days: 14
          if-no-files-found: error

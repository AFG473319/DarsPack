<!doctype html>
<!-- Phone web client (کلاینت گوشی). One static page: no framework, no
     build step. dir="rtl" Persian-first. The PIN is kept in localStorage
     after the first successful call, so it is asked once per device. -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico">
<title>درس‌پک</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: Tahoma, sans-serif; margin: 0; background: #1e1f24; color: #e8e8ea; }
  header { background: #2d3f6e; padding: 12px 16px; font-size: 18px; font-weight: bold; }
  main { padding: 12px 16px; max-width: 640px; margin: 0 auto; }
  #pinbox, #files { display: none; }
  input, button {
    font-family: inherit; font-size: 16px; border-radius: 8px;
    border: 1px solid #3a3b42; padding: 10px 12px; background: #2a2b31; color: inherit;
  }
  button { background: #3a5290; border: none; width: 100%; margin-top: 10px; }
  input { width: 100%; box-sizing: border-box; }
  #chips { margin: 10px 0 2px; }
  .chip { display: inline-block; width: auto; margin: 0 0 6px 6px; padding: 6px 12px;
          font-size: 14px; background: #2a2b31; border: 1px solid #3a3b42;
          border-radius: 16px; }
  .chip.on { background: #3a5290; border-color: #5a74b8; }
  .file { background: #23242a; border: 1px solid #3a3b42; border-radius: 8px;
          padding: 10px 12px; margin: 8px 0; }
  .file .name { font-weight: bold; word-break: break-all; }
  .file .meta { color: #a0a0a8; font-size: 13px; margin-top: 4px; }
  .file a { color: #9db4ef; text-decoration: none; float: left; }
  #status { color: #a0a0a8; font-size: 13px; }
</style>
</head>
<body>
<header>درس‌پک — کتابخانه‌ی هم‌کلاسی</header>
<main>
  <div id="pinbox">
    <p>رمز اتصال را از صاحب کتابخانه بگیرید:</p>
    <input id="pin" inputmode="numeric" maxlength="6" placeholder="PIN (۶ رقم)">
    <button onclick="savePin()">اتصال</button>
    <p id="pinerr" style="color:#e08080"></p>
  </div>
  <div id="files">
    <input id="q" placeholder="جست‌جو…" oninput="debouncedSearch()">
    <div id="chips"></div>
    <div id="list"></div>
    <p id="status"></p>
    <hr>
    <p>افزودن فایل به کتابخانه:</p>
    <input type="file" id="up" onchange="upload()">
    <p id="upstatus"></p>
  </div>
</main>
<script>
// Every element is fetched explicitly with $() — no reliance on the
// browser's implicit id-globals (a mismatch there caused a silent
// ReferenceError: the PIN button did nothing, 2026-10-24).
const $ = id => document.getElementById(id);
let timer = null;
let subjectFilter = null;      // null = همه; 'u' = بدون درس; else subject id
let subjects = [];             // from /api/subjects: {id, name, count}
let unclassified = 0;
const currentPin = () => localStorage.getItem('darspack-pin') || '';

// Persian digits everywhere a count or size is shown
function faNum(s) {
  return String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}
function humanSize(n) {
  if (n >= 1048576) return faNum((n / 1048576).toFixed(1)) + ' مگابایت';
  if (n >= 1024) return faNum(Math.round(n / 1024)) + ' کیلوبایت';
  return faNum(n) + ' بایت';
}

async function api(path, options) {
  const sep = path.includes('?') ? '&' : '?';
  const res = await fetch(path + sep + 'pin=' + encodeURIComponent(currentPin()), options);
  if (res.status === 403) {
    localStorage.removeItem('darspack-pin');
    showPin();
    throw new Error('bad pin');
  }
  return res;
}

function showPin() {
  $('pinbox').style.display = 'block';
  $('files').style.display = 'none';
}

async function savePin() {
  $('pinerr').textContent = '';
  localStorage.setItem('darspack-pin', $('pin').value.trim());
  try {
    await search();                       // rejects on a wrong PIN
    $('files').style.display = 'block';
    $('pinbox').style.display = 'none';
    loadSubjects().catch(() => {});
  } catch (e) {
    localStorage.removeItem('darspack-pin');
    $('pinerr').textContent = 'رمز درست نیست؛ دوباره امتحان کنید.';
  }
}

function renderChips() {
  // «همه» + «بدون درس» + one chip per subject, each with its count
  const chips = [{ id: null, name: 'همه', count:
                     subjects.reduce((a, s) => a + s.count, 0) + unclassified },
                 { id: 'u', name: 'بدون درس', count: unclassified }]
                 .concat(subjects);
  $('chips').innerHTML = chips.map(s =>
    `<button class="chip${s.id === subjectFilter ? ' on' : ''}"` +
    ` onclick="pickSubject(${JSON.stringify(s.id)})">` +
    `${escapeHtml(s.name)} <b>${faNum(s.count)}</b></button>`).join('');
}

function pickSubject(id) {
  subjectFilter = id;
  renderChips();
  search().catch(() => {});
}

function render(rows) {
  $('list').innerHTML = rows.map(f =>
    `<div class="file"><div class="name">${escapeHtml(f.name)}</div>
     <div class="meta">${escapeHtml(f.subject || '—')} · فصل ${f.chapter ?? '—'} · ${escapeHtml(f.kind || '—')} · ${humanSize(f.size)}</div>
     <a href="/api/file/${f.id}?pin=${encodeURIComponent(currentPin())}">دانلود ⬇</a></div>`).join('')
    || '<p style="color:#a0a0a8">چیزی پیدا نشد.</p>';
}

async function search() {
  let url = '/api/search?q=' + encodeURIComponent($('q').value);
  if (subjectFilter === 'u') url += '&unclassified=1';
  else if (subjectFilter !== null) url += '&subject_id=' + subjectFilter;
  const res = await api(url);
  render((await res.json()).files);
}

async function loadSubjects() {
  const data = await (await api('/api/subjects')).json();
  subjects = data.subjects;
  unclassified = data.unclassified;
  renderChips();
}

function debouncedSearch() {
  clearTimeout(timer);
  timer = setTimeout(() => search().catch(() => {}), 300);
}

async function upload() {
  const file = $('up').files[0];
  if (!file) return;
  $('upstatus').textContent = 'در حال ارسال: ' + file.name;
  try {
    const res = await api('/api/upload?name=' + encodeURIComponent(file.name),
                          { method: 'POST', body: file });
    const data = await res.json();
    $('upstatus').textContent = data.message || data.status;
    await search();
    loadSubjects().catch(() => {});       // the «بدون درس» chip grew
  } catch (e) {
    $('upstatus').textContent = 'ارسال نشد — دوباره امتحان کنید.';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

(currentPin() ? (search().catch(() => {}), loadSubjects().catch(() => {}))
              : showPin());
</script>
</body>
</html>
